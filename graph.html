<!-- Scrollama - First graph no purple, second graph has purple -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Word Web For Main LDA Themes</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <!-- Increase the width and height of the SVG -->
  <svg width="1000" height="700"></svg>

  <script>
    // Define a JavaScript object to map comic names to their image sources
    const comicImages = {
      "Kate Berlant": "/index/images/berlant_no_bg.png",
      "Kanan": "/index/images/gill_no_bg.png",
      "Kenny": "/index/images/seb_no_bg.png",
      "Vir": "/index/images/das_no_bg.png",
      "Rock": "/index/images/rock_no_bg.png",
      "Mulaney": "/index/images/mulaney_no_bg.png",
      // Specify the image path for each comic
    };

    d3.csv("standup.csv").then(function(data) {
      const nodes = {};
      const links = [];
      const wordCounts = {};

      data.forEach(function(d) {
        const comic = d.Comic;
        const word = d.Word.toLowerCase(); // Convert word to lowercase for case insensitivity
        
        // If the word hasn't been encountered for this comic yet, count it
        if (!wordCounts[word]) {
          wordCounts[word] = { count: 0, comics: {} };
        }
        if (!wordCounts[word].comics[comic]) {
          wordCounts[word].comics[comic] = true;
          wordCounts[word].count++;

          // Create nodes for comics
          if (!nodes[comic]) nodes[comic] = { name: comic, type: "comic", image: comicImages[comic] }; // Retrieve the image source for the comic

          // Create nodes for words and connect comics to words
          if (!nodes[word]) {
            nodes[word] = { name: word, type: "word", count: wordCounts[word].count };
          }
          links.push({ source: comic, target: word });
        }
      });

      // Convert nodes object to array
      const nodesArray = Object.values(nodes);

      const svg = d3.select("svg"),
        width = +svg.attr("width"),
        height = +svg.attr("height");

      const simulation = d3.forceSimulation(nodesArray)
        .force("link", d3.forceLink(links).id(d => d.name))
        .force("charge", d3.forceManyBody().strength(-50))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("x", d3.forceX().strength(0.1).x(width / 2))
        .force("y", d3.forceY().strength(0.1).y(height / 2))
        .force("collision", d3.forceCollide().radius(d => d.type === "comic" ? 50 : 20)); // Adjust radius for collision

      const link = svg.selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6);

      const node = svg.selectAll("g")
        .data(nodesArray)
        .enter().append("g")
        .attr("class", "node")
        .call(drag(simulation)); // Enable dragging for nodes

      node.filter(d => d.type === "comic")
        .append("image")
        .attr("xlink:href", d => d.image) // Set image source for comic nodes
        .attr("x", -24) // Adjust x position to center image
        .attr("y", -24) // Adjust y position to center image
        .attr("width", 48) // Set image width
        .attr("height", 48); // Set image height

   
        // console.log(wordCounts);
      node.filter(d => d.type === "word") // Filter to only words
        .append("circle")
        .attr("r", 10) // Set larger radius for all words
        .attr("fill", d => wordCounts[d.name].count >= 2 ? "purple" : "steelblue"); // Color words based on count

      const label = node.append('text')
        .text(d => d.name)
        .attr('font-size', 16) // Increase font size for labels
        .attr('text-anchor', 'middle') // Center-align text
        .attr('dy', 24); // Adjust vertical alignment of text

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("transform", d => `translate(${d.x},${d.y})`); // Update node position using transform attribute
      });

      function drag(simulation) {
        function dragstarted(event) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          event.subject.fx = event.subject.x;
          event.subject.fy = event.subject.y;
        }

        function dragged(event) {
          event.subject.fx = event.x;
          event.subject.fy = event.y;
        }

        function dragended(event) {
          if (!event.active) simulation.alphaTarget(0);
          event.subject.fx = null;
          event.subject.fy = null;
        }

        return d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended);
      }
    });
  </script>
  
</body>
</html>

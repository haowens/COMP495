<!-- Scrollama - First graph no purple, second graph has purple -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Word Web For Main LDA Themes</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <svg width="800" height="500"></svg>

  <script>
    d3.csv("standup.csv").then(function(data) {
      const nodes = {};
      const links = [];

      data.forEach(function(d) {
        const comic = d.Comic;
        const word = d.Word.toLowerCase(); // Convert word to lowercase for case insensitivity

        // Create nodes for comics
        if (!nodes[comic]) nodes[comic] = { name: comic, type: "comic" };

        // Create nodes for words and connect comics to words
        if (!nodes[word]) {
          nodes[word] = { name: word, type: "word" };
        }
        links.push({ source: comic, target: word });
      });

      // Count how many times each word appears across all comics
      const wordCounts = {};
      data.forEach(function(d) {
        const word = d.Word.toLowerCase(); // Convert word to lowercase for case insensitivity
        wordCounts[word] = (wordCounts[word] || 0) + 1;
      });

      // Convert nodes object to array
      const nodesArray = Object.values(nodes);

      const svg = d3.select("svg"),
        width = +svg.attr("width"),
        height = +svg.attr("height");

      const simulation = d3.forceSimulation(nodesArray)
        .force("link", d3.forceLink(links).id(d => d.name))
        .force("charge", d3.forceManyBody().strength(-50))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("x", d3.forceX().strength(0.1).x(width / 2))
        .force("y", d3.forceY().strength(0.1).y(height / 2))
        .force("collision", d3.forceCollide().radius(d => d.type === "comic" ? 50 : 20)); // Adjust radius for collision

      const link = svg.selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6);

      const node = svg.selectAll("circle")
        .data(nodesArray)
        .enter().append("circle")
        .attr("r", d => d.type === "comic" ? 12 : (d.type === "word" ? 8 : 5)) // Different radius for comics, words, and themes
        .attr("fill", d => {
          if (d.type === "comic") return "orange";
          else if (d.type === "word" && wordCounts[d.name] > 1) return "purple"; // Color word nodes purple if they are shared between comics
          else return "steelblue";
        })
        .call(drag(simulation)); // Enable dragging for nodes

      const label = svg.selectAll(null)
        .data(nodesArray)
        .enter()
        .append('text')
        .text(d => d.name)
        .attr('font-size', 12)
        .attr('dx', 15)
        .attr('dy', 4);

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);

        label
          .attr('x', d => d.x)
          .attr('y', d => d.y);
      });

      function drag(simulation) {
        function dragstarted(event) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          event.subject.fx = event.subject.x;
          event.subject.fy = event.subject.y;
        }

        function dragged(event) {
          event.subject.fx = event.x;
          event.subject.fy = event.y;
        }

        function dragended(event) {
          if (!event.active) simulation.alphaTarget(0);
          event.subject.fx = null;
          event.subject.fy = null;
        }

        return d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended);
      }
    });
  </script>

<p> Testing </p>
  
</body>
</html>
